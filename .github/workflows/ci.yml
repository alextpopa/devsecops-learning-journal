name: DevSecOps CI Pipeline

# Trigger this pipeline on every push to the main branch
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Download your repository code onto the runner
      - name: Checkout code
        uses: actions/checkout@v4
      # 2. Verify Docker is available on the runner
      - name: Check Docker version
        run: docker --version
      # 3. Spin up an Nginx container *inside* Github;s cloud runner to test it
      - name: Run test Nginx container
        run: |
          docker run -d -p 8080:80 --name test-nginx nginx
          docker ps
          curl http://localhost:8080

      # 4. Run a simple command to verify automation is working
      - name: Run verification script
        run: |
          echo "Pipeline triggered successfully!"
          echo "Listing repository files:"
          ls -la
