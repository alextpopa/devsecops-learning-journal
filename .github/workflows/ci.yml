name: DevSecOps Shift-Left Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  security-and-build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout your code
      - name: Checkout code
        uses: actions/checkout@v4
      # 2. Run SAST (Static Application Security Testing) using Bandit
      - name: Run SAST Security Scan
        run: |
          echo "Running Bandit SAST scan on repository code..."
          pip install bandit
          bandit -r . || true
      # 3. Spin up and test your Docker container
      - name: Run test Nginx container
        run: |
          docker run -d -p 8080:80 --name test-nginx nginx
          echo "Waiting for Nginx to start...."
          sleep 3
          docker ps
          curl -I http://localhost:8080

      # 4. Run Container Vulnerability Scanning using Trivy
      - name: Run Container Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'nginx:latest'
          format: 'table'
          exit-code: '0'
          vuln-type: 'os,library'
